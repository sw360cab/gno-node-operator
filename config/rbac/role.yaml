---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - monitoring.k8s.gno.land
  resources:
  - gnonodehealths
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.k8s.gno.land
  resources:
  - gnonodehealths/finalizers
  verbs:
  - update
- apiGroups:
  - monitoring.k8s.gno.land
  resources:
  - gnonodehealths/status
  verbs:
  - get
  - patch
  - update
